<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flipbook</title>
<style>
  :root { --bg:#555; --bar:#2a2a2a; --ink:#e8e8e8; --dim:#9a9a9a; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink);
    font:14px/1.4 system-ui, sans-serif; overflow:hidden; }
  body { display:flex; flex-direction:column; height:100dvh; }

  #stage { flex:1; min-height:0; position:relative; touch-action:none;
    user-select:none; -webkit-user-select:none; }

  /* หน้าหนังสือ: ทุกชั้นซ้อนกันด้วย position:absolute */
  #book { position:absolute; overflow:hidden; background:#fff; transform-origin:0 0;
    box-shadow:0 6px 24px #0009; display:none; }
  #book img, #book div { position:absolute; top:0; height:100%;
    pointer-events:none; -webkit-user-drag:none; }
  #imgUnder, #imgTop { left:0; width:100%; }

  .shade { width:0; }
  #shadeNext { background:linear-gradient(to right, rgba(0,0,0,.38), rgba(0,0,0,0)); }
  #shadeTop  { background:linear-gradient(to left,  rgba(0,0,0,.30), rgba(0,0,0,0)); }

  /* ด้านหลังกระดาษที่พับ: กลับด้านรูป แล้วทำให้จางลง */
  #strip { overflow:hidden; background:#ececef; }
  #imgBack { left:0; opacity:.5; transform:scaleX(-1); }
  #stripShade { left:0; width:100%;
    background:linear-gradient(to right,
      rgba(0,0,0,.22) 0%, rgba(255,255,255,.55) 14%,
      rgba(255,255,255,.30) 80%, rgba(0,0,0,.30) 100%); }

  #msg { position:absolute; inset:0; display:flex; align-items:center;
    justify-content:center; text-align:center; padding:24px; color:var(--dim); }
  #msg[hidden] { display:none; }

  /* แถบปุ่มด้านล่าง */
  #bar { height:48px; flex:none; background:var(--bar); display:flex;
    align-items:center; justify-content:space-between; padding:0 6px;
    padding-bottom:env(safe-area-inset-bottom); }
  #bar .grp { display:flex; align-items:center; gap:2px; }
  button { background:none; border:0; color:var(--ink); width:40px; height:40px;
    border-radius:6px; display:grid; place-items:center; cursor:pointer; }
  button:active { background:#ffffff22; }
  button:focus-visible { outline:2px solid #fff; outline-offset:-2px; }
  button svg { width:20px; height:20px; fill:none; stroke:currentColor;
    stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  #pageBox { display:flex; align-items:center; gap:4px; color:var(--dim); margin:0 4px; }
  #pageNo { width:46px; height:28px; text-align:center; border:0; border-radius:3px;
    background:#fff; color:#111; font:inherit; }

  /* เต็มจอ: แถบปุ่มลอยทับ และซ่อนอัตโนมัติ */
  body.fs #bar { position:fixed; left:0; right:0; bottom:0; z-index:30;
    transition:opacity .25s; }
  #bar.hide { opacity:0; pointer-events:none; }
  #tapZone { position:fixed; left:0; right:0; bottom:0; height:56px; z-index:40; }
  #tapZone[hidden] { display:none; }
  body.fs #thumbs { padding-bottom:72px; }

  /* ดูทุกหน้า */
  #thumbs { position:absolute; inset:0; background:#1d1d1dee; z-index:20;
    overflow:auto; padding:16px; display:grid;
    grid-template-columns:repeat(auto-fill, minmax(110px, 1fr)); gap:12px;
    align-content:start; touch-action:pan-y; }
  #thumbs[hidden] { display:none; }
  #thumbs figure { margin:0; cursor:pointer; text-align:center; color:var(--dim); }
  #thumbs img { width:100%; display:block; border:2px solid transparent; border-radius:3px; }
  #thumbs figure.on img { border-color:#fff; }
</style>
</head>
<body>

<div id="stage">
  <div id="book">
    <img id="imgUnder" alt="">
    <div id="shadeNext" class="shade"></div>
    <img id="imgTop" alt="">
    <div id="shadeTop" class="shade"></div>
    <div id="strip"><img id="imgBack" alt=""><div id="stripShade"></div></div>
  </div>
  <div id="msg" hidden>ไม่พบรูป ตรวจสอบว่ามีไฟล์ images/page1.jpg และชื่อเรียงต่อเนื่องกัน</div>
  <div id="thumbs" hidden></div>
</div>

<div id="bar">
  <div class="grp">
    <button id="btnThumbs" title="ดูทุกหน้า" aria-label="ดูทุกหน้า">
      <svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6"/><rect x="14" y="4" width="6" height="6"/><rect x="4" y="14" width="6" height="6"/><rect x="14" y="14" width="6" height="6"/></svg>
    </button>
  </div>

  <div class="grp">
    <button id="btnFirst" title="หน้าแรก" aria-label="หน้าแรก">
      <svg viewBox="0 0 24 24"><path d="M6 5v14M18 6l-8 6 8 6"/></svg>
    </button>
    <button id="btnPrev" title="ก่อนหน้า" aria-label="ก่อนหน้า">
      <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
    </button>
    <div id="pageBox">
      <input id="pageNo" type="number" inputmode="numeric" min="1" value="1" aria-label="เลขหน้า">
      <span>/ <span id="pageTotal">0</span></span>
    </div>
    <button id="btnNext" title="ถัดไป" aria-label="ถัดไป">
      <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
    </button>
    <button id="btnLast" title="หน้าสุดท้าย" aria-label="หน้าสุดท้าย">
      <svg viewBox="0 0 24 24"><path d="M18 5v14M6 6l8 6-8 6"/></svg>
    </button>
  </div>

  <div class="grp">
    <button id="btnFs" title="เต็มจอ" aria-label="เต็มจอ">
      <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
  </div>
</div>

<div id="tapZone" hidden></div>

<script>
  // โค้ดนับจำนวนหน้าเอง: ใส่รูปชื่อ page1.jpg, page2.jpg, page3.jpg ... ต่อเนื่องกัน
  // ในโฟลเดอร์ images/ กี่รูปก็ได้ ไม่ต้องแก้ไฟล์นี้อีก
  // รูปเก็บใน repo แยก (เปิด GitHub Pages ไว้) แยกโฟลเดอร์ตามเล่ม
  // เปิดเล่มด้วยลิงก์ ...github.io/Doy/?book=book1  (ไม่ใส่ ?book= จะใช้โฟลเดอร์ images/ ใน repo นี้เหมือนเดิม)
  const BASE = "https://doymili.github.io/doy-images/";   // เปลี่ยนถ้าตั้งชื่อ repo รูปเป็นอย่างอื่น
  const bookName = (new URLSearchParams(location.search).get("book") || "").replace(/[^\w-]/g, "");
  const DIR = bookName ? `${BASE}${bookName}/` : "images/";
  const EXT = "jpg";      // ถ้ารูปเป็น png ให้เปลี่ยนเป็น "png"
  let PAGES = [];         // เติมอัตโนมัติตอนโหลดหน้า

  const $ = id => document.getElementById(id);
  const stage = $("stage"), book = $("book");
  const imgTop = $("imgTop"), imgUnder = $("imgUnder"), imgBack = $("imgBack");
  const strip = $("strip"), shadeTop = $("shadeTop"), shadeNext = $("shadeNext");
  let N = 0;            // จำนวนหน้า (นับอัตโนมัติ)

  let cur = 0;          // หน้าปัจจุบัน (เริ่มที่ 0)
  let W = 0, H = 0;     // ขนาดหน้าหนังสือ (px)
  let ratio = 1;        // สูง / กว้าง ของรูป
  let M = 0;            // ตำแหน่งรอยพับ: W = ยังไม่พลิก, 0 = พลิกเสร็จแล้ว
  let turn = null;      // { t: หน้าที่กำลังพลิก, dir: "next" | "prev" }
  let busy = false, ready = false, raf = 0;

  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

  function setSrc(el, i) {
    const s = PAGES[i];
    if (s === undefined) { el.style.visibility = "hidden"; return; }
    el.style.visibility = "visible";
    if (el.getAttribute("src") !== s) el.src = s;
  }

  // ตั้งชั้นรูป: หน้า t อยู่บน, หน้า t+1 อยู่ข้างใต้
  function layout(t, m) {
    setSrc(imgTop, t); setSrc(imgBack, t); setSrc(imgUnder, t + 1);
    render(m);
  }

  // วาดตามตำแหน่งรอยพับ m
  function render(m) {
    M = m;
    const sw = W - m;                           // ความกว้างแถบด้านหลังกระดาษ
    imgTop.style.clipPath = `inset(0 ${sw}px 0 0)`;
    if (sw < 0.5) {
      strip.style.display = shadeTop.style.display = shadeNext.style.display = "none";
      return;
    }
    const f = 2 * m - W;                        // ขอบซ้ายของแถบ (มุมกระดาษ)
    strip.style.display = "block";
    strip.style.left = f + "px";
    strip.style.width = sw + "px";
    shadeTop.style.display = "block";
    shadeTop.style.left = (f - 30) + "px";
    shadeTop.style.width = "30px";
    shadeNext.style.display = m > 1 ? "block" : "none";
    shadeNext.style.left = m + "px";
    shadeNext.style.width = "40px";
  }

  function updateUI(i) {
    $("pageNo").value = i + 1;
    document.querySelectorAll("#thumbs figure").forEach((f, k) =>
      f.classList.toggle("on", k === i));
  }

  function fit() {
    const aw = stage.clientWidth - 20, ah = stage.clientHeight - 24;
    let w = aw, h = w * ratio;
    if (h > ah) { h = ah; w = h / ratio; }
    W = w; H = h;
    book.style.width = w + "px";
    book.style.height = h + "px";
    book.style.left = (stage.clientWidth - w) / 2 + "px";
    book.style.top = (stage.clientHeight - h) / 2 + "px";
    imgBack.style.width = w + "px";
    Z = 1; TX = 0; TY = 0; book.style.transform = "none";
    if (!turn) layout(cur, W); else render(clamp(M, 0, W));
  }

  function finish() {
    cur = M >= W - 0.5 ? turn.t : turn.t + 1;
    turn = null; busy = false;
    layout(cur, W);
    updateUI(cur);
  }

  function animateTo(target) {
    busy = true;
    cancelAnimationFrame(raf);
    const from = M, t0 = performance.now();
    const dur = Math.max(160, 480 * Math.abs(target - from) / W);
    const step = now => {
      const k = Math.min(1, (now - t0) / dur);
      const e = 1 - Math.pow(1 - k, 3);
      render(from + (target - from) * e);
      if (k < 1) raf = requestAnimationFrame(step);
      else { render(target); finish(); }
    };
    raf = requestAnimationFrame(step);
  }

  function go(d) {
    if (busy || !ready) return;
    resetZoom();
    if (d > 0 && cur < N - 1) { turn = { t: cur, dir: "next" }; layout(cur, W); animateTo(0); }
    else if (d < 0 && cur > 0) { turn = { t: cur - 1, dir: "prev" }; layout(cur - 1, 0); animateTo(W); }
  }

  function goTo(i) {
    if (busy || !ready) return;
    resetZoom();
    cur = clamp(i, 0, N - 1);
    layout(cur, W);
    updateUI(cur);
  }

  // ===== ซูม: ถ่าง/บีบสองนิ้ว, แตะสองครั้ง, ล้อเมาส์ =====
  let Z = 1, TX = 0, TY = 0;          // ระดับซูม และระยะเลื่อนของหน้าหนังสือ
  const MAXZ = 5;

  function applyZoom() {
    const SW = stage.clientWidth, SH = stage.clientHeight;
    const bl = book.offsetLeft, bt = book.offsetTop;
    const sw = W * Z, sh = H * Z;
    let x0 = bl + TX, y0 = bt + TY;
    x0 = sw <= SW ? (SW - sw) / 2 : clamp(x0, SW - sw, 0);   // ไม่ให้เลื่อนเลยขอบภาพ
    y0 = sh <= SH ? (SH - sh) / 2 : clamp(y0, SH - sh, 0);
    TX = x0 - bl; TY = y0 - bt;
    book.style.transform = `translate(${TX}px, ${TY}px) scale(${Z})`;
  }

  function resetZoom() { Z = 1; TX = 0; TY = 0; applyZoom(); }

  // ซูมโดยให้จุด (cx, cy) บนหน้าจอ อยู่กับที่
  function zoomAt(cx, cy, nz) {
    nz = clamp(nz, 1, MAXZ);
    const px = (cx - book.offsetLeft - TX) / Z, py = (cy - book.offsetTop - TY) / Z;
    Z = nz;
    TX = cx - book.offsetLeft - Z * px;
    TY = cy - book.offsetTop - Z * py;
    if (Z < 1.001) { Z = 1; TX = 0; TY = 0; }
    applyZoom();
  }

  // ===== ท่าทางสัมผัส =====
  const pts = new Map();   // นิ้วที่แตะอยู่ตอนนี้
  let g = null;            // ท่านิ้วเดียว: พลิกหน้า หรือเลื่อนภาพตอนซูม
  let pz = null;           // ท่าสองนิ้ว: ถ่าง/บีบเพื่อซูม
  let lastTap = { t: 0, x: 0, y: 0 };

  function track(e) {
    const r = stage.getBoundingClientRect();
    pts.set(e.pointerId, { x: e.clientX - r.left, y: e.clientY - r.top,
                           cx: e.clientX, cy: e.clientY });
  }

  function startPinch() {
    const [a, b] = [...pts.values()];
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    pz = { d0: Math.max(1, Math.hypot(a.x - b.x, a.y - b.y)), z0: Z,
           px: (mx - book.offsetLeft - TX) / Z, py: (my - book.offsetTop - TY) / Z };
  }

  function updatePinch() {
    const [a, b] = [...pts.values()];
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    // นิ้วถ่างออก = ซูมเข้า, นิ้วบีบเข้าหากัน = ซูมออก
    Z = clamp(pz.z0 * Math.hypot(a.x - b.x, a.y - b.y) / pz.d0, 1, MAXZ);
    TX = mx - book.offsetLeft - Z * pz.px;
    TY = my - book.offsetTop - Z * pz.py;
    applyZoom();
  }

  stage.addEventListener("pointerdown", e => {
    if (busy || !ready || e.target.closest("#thumbs")) return;
    track(e);
    stage.setPointerCapture(e.pointerId);
    if (pts.size === 2) {
      if (g && (g.mode === "next" || g.mode === "prev")) {
        // กำลังลากพลิกหน้าแล้วมีนิ้วที่สองมา: คืนหน้ากลับที่เดิม
        const m = g.mode; g = null; pts.clear();
        animateTo(m === "next" ? W : 0);
        return;
      }
      g = null; startPinch(); return;
    }
    if (pts.size === 1) {
      g = { id: e.pointerId, sx: e.clientX, sy: e.clientY, lx: e.clientX,
            lt: e.timeStamp, vx: 0, mode: null, tx0: TX, ty0: TY };
    }
  });

  stage.addEventListener("pointermove", e => {
    if (pts.has(e.pointerId)) track(e);
    if (pz && pts.size >= 2) { updatePinch(); return; }
    if (!g || e.pointerId !== g.id) return;
    const dx = e.clientX - g.sx, dy = e.clientY - g.sy;

    if (Z > 1.01) {                       // ซูมอยู่: นิ้วเดียว = เลื่อนดูภาพ
      if (g.mode === null && Math.hypot(dx, dy) > 6) g.mode = "pan";
      if (g.mode === "pan") { TX = g.tx0 + dx; TY = g.ty0 + dy; applyZoom(); }
      return;
    }

    const dt = e.timeStamp - g.lt;
    if (dt > 0) {
      g.vx = 0.6 * g.vx + 0.4 * ((e.clientX - g.lx) / dt);
      g.lx = e.clientX; g.lt = e.timeStamp;
    }
    if (g.mode === null) {
      if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)) {
        if (dx < 0 && cur < N - 1) { turn = { t: cur, dir: "next" }; g.mode = "next"; layout(cur, W); }
        else if (dx > 0 && cur > 0) { turn = { t: cur - 1, dir: "prev" }; g.mode = "prev"; layout(cur - 1, 0); }
        else g.mode = "none";
      } else if (Math.abs(dy) > 8) g.mode = "none";
      else return;
    }
    if (g.mode === "next") render(clamp(W + dx, 0, W));
    else if (g.mode === "prev") render(clamp(dx, 0, W));
  });

  function endGesture(e, cancelled) {
    pts.delete(e.pointerId);

    if (pz) {                             // จบท่าสองนิ้ว
      if (pts.size < 2) {
        pz = null;
        if (Z < 1.03) resetZoom();
        g = null;
        const rest = [...pts.entries()][0];
        if (rest) {                       // นิ้วที่เหลือ: ถ้าซูมอยู่ให้เลื่อนภาพต่อได้
          const [id, p] = rest;
          g = { id, sx: p.cx, sy: p.cy, lx: p.cx, lt: e.timeStamp, vx: 0,
                mode: Z > 1.01 ? "pan" : "none", tx0: TX, ty0: TY };
        }
      }
      return;
    }

    if (!g || e.pointerId !== g.id) return;
    const s = g; g = null;

    if (s.mode === "next") {
      const done = !cancelled && ((M < W * 0.6 && s.vx < 0.3) || s.vx < -0.5);
      animateTo(done ? 0 : W);
    } else if (s.mode === "prev") {
      const done = !cancelled && ((M > W * 0.4 && s.vx > -0.3) || s.vx > 0.5);
      animateTo(done ? W : 0);
    } else if (s.mode === null && !cancelled) {
      // แตะเฉย ๆ: แตะกลางภาพสองครั้ง = ซูม / ย้อนกลับ, แตะขอบซ้าย-ขวา = พลิกหน้า
      const sr = stage.getBoundingClientRect();
      const sx = e.clientX - sr.left, sy = e.clientY - sr.top;
      const rx = (sx - book.offsetLeft - TX) / (W * Z);
      const ry = (sy - book.offsetTop - TY) / (H * Z);
      if (rx < 0 || rx > 1 || ry < 0 || ry > 1) return;
      const zoomed = Z > 1.01;
      const edge = !zoomed && (rx < 0.3 || rx > 0.7);

      if (edge) {
        lastTap.t = 0;
        go(rx < 0.3 ? -1 : 1);
      } else {
        const dbl = e.timeStamp - lastTap.t < 320 &&
                    Math.hypot(e.clientX - lastTap.x, e.clientY - lastTap.y) < 30;
        if (dbl) { lastTap.t = 0; zoomed ? resetZoom() : zoomAt(sx, sy, 2.5); }
        else lastTap = { t: e.timeStamp, x: e.clientX, y: e.clientY };
      }
    }
  }
  stage.addEventListener("pointerup", e => endGesture(e, false));
  stage.addEventListener("pointercancel", e => endGesture(e, true));

  // ล้อเมาส์ซูม (คอมพิวเตอร์)
  stage.addEventListener("wheel", e => {
    if (!ready || busy || !$("thumbs").hidden) return;
    e.preventDefault();
    const r = stage.getBoundingClientRect();
    zoomAt(e.clientX - r.left, e.clientY - r.top, Z * Math.exp(-e.deltaY * 0.0015));
  }, { passive: false });

  // ดูทุกหน้า
  function buildThumbs() {
    const box = $("thumbs");
    PAGES.forEach((src, i) => {
      const f = document.createElement("figure");
      f.innerHTML = `<img src="${src}" alt="หน้า ${i + 1}" loading="lazy"><figcaption>${i + 1}</figcaption>`;
      f.onclick = () => { box.hidden = true; goTo(i); };
      box.appendChild(f);
    });
  }

  // ปุ่มควบคุม
  $("btnFirst").onclick = () => goTo(0);
  $("btnLast").onclick  = () => goTo(N - 1);
  $("btnPrev").onclick  = () => go(-1);
  $("btnNext").onclick  = () => go(1);
  $("btnThumbs").onclick = () => { $("thumbs").hidden = !$("thumbs").hidden; };
  $("pageNo").onchange = e => goTo((parseInt(e.target.value, 10) || 1) - 1);

  document.addEventListener("keydown", e => {
    if (e.target.tagName === "INPUT") return;
    if (e.key === "ArrowRight") go(1);
    if (e.key === "ArrowLeft")  go(-1);
  });

  // เต็มจอ (iPhone Safari ไม่รองรับสำหรับหน้าเว็บทั่วไป จึงซ่อนปุ่มไว้)
  const root = document.documentElement;
  if (!root.requestFullscreen) $("btnFs").style.display = "none";
  $("btnFs").onclick = () =>
    document.fullscreenElement ? document.exitFullscreen() : root.requestFullscreen();
  // เต็มจอ: แถบปุ่มซ่อนเอง และเรียกกลับด้วยการแตะ 2 ครั้งตรงจุดที่หายไป
  const bar = $("bar"), tapZone = $("tapZone");
  let hideT = 0, zt = [];
  const isFs = () => !!document.fullscreenElement;

  function hideBar() {
    if (!isFs()) return;
    bar.classList.add("hide");
    tapZone.hidden = false;
  }
  function kick() {                       // เริ่มนับ 3 วินาทีใหม่ทุกครั้งที่กดปุ่ม
    clearTimeout(hideT);
    if (isFs()) hideT = setTimeout(hideBar, 3000);
  }
  function showBar() {
    bar.classList.remove("hide");
    tapZone.hidden = true;
    kick();
  }
  bar.addEventListener("pointerdown", kick);
  bar.addEventListener("input", kick);
  tapZone.addEventListener("pointerdown", e => {
    zt = zt.filter(t => e.timeStamp - t < 800);
    zt.push(e.timeStamp);
    if (zt.length >= 2) { zt = []; showBar(); }
  });

  document.addEventListener("fullscreenchange", () => {
    document.body.classList.toggle("fs", isFs());
    clearTimeout(hideT);
    if (isFs()) hideBar();                // เข้าเต็มจอ: ซ่อนแถบทันที
    else { bar.classList.remove("hide"); tapZone.hidden = true; }
    setTimeout(fit, 300);
  });
  window.addEventListener("resize", () => { if (ready) fit(); });

  // หารูปทีละชุด (8 รูปต่อรอบ) จนเจอเลขที่ไม่มีไฟล์ แล้วหยุด
  function tryLoad(src) {
    return new Promise(res => {
      const im = new Image();
      im.onload = () => res(im);
      im.onerror = () => res(null);
      im.src = src;
    });
  }

  async function discover() {
    const found = [];
    for (let i = 1; i <= 1000; i += 8) {
      const batch = await Promise.all(
        Array.from({ length: 8 }, (_, k) => tryLoad(`${DIR}page${i + k}.${EXT}`)));
      for (const im of batch) {
        if (!im) return found;
        found.push(im);
      }
    }
    return found;
  }

  discover().then(imgs => {
    if (!imgs.length) { $("msg").hidden = false; return; }
    window._pageCache = imgs;                      // เก็บไว้ให้รูปโหลดล่วงหน้าค้างใน cache
    PAGES = imgs.map((_, k) => `${DIR}page${k + 1}.${EXT}`);
    N = PAGES.length;
    ratio = imgs[0].naturalHeight / imgs[0].naturalWidth;
    $("pageTotal").textContent = N;
    $("pageNo").max = N;
    book.style.display = "block";
    ready = true;
    buildThumbs();
    fit();
    updateUI(0);
  });
</script>
</body>
</html>
