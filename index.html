<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ชั้นหนังสือ</title>
<script>
  // ลิงก์เก่าแบบ ?book=... ให้เด้งไปหน้าอ่านเหมือนเดิม
  (function () {
    const b = new URLSearchParams(location.search).get("book");
    if (b) location.replace("reader.html?book=" + b.split("/").map(encodeURIComponent).join("/"));
  })();
</script>
<style>
  :root {
    --ch: 156px;      /* ความสูงปกหนังสือ */
    --plank: 14px;    /* ความหนาไม้กระดานชั้นวาง */
    --cap: 40px;      /* พื้นที่ชื่อเรื่องใต้ชั้น */
    --tile: calc(var(--ch) + var(--plank) + 4px + var(--cap));
    --ink: #f1e6d6;
    --dim: #b9a58c;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: radial-gradient(120% 80% at 50% 0%, #3a2a1e 0%, #1c140e 60%, #120c08 100%) fixed;
    color: var(--ink);
    font: 15px/1.4 "Noto Serif Thai", Georgia, "Times New Roman", serif;
  }

  header { padding: 30px 20px 14px; text-align: center; }
  h1 { margin: 0; font-size: 26px; font-weight: 600; letter-spacing: .04em; }
  .sub { margin-top: 4px; color: var(--dim); font-size: 13px; }
  main { max-width: 960px; margin: 0 auto; padding: 10px 0 56px; }

  /* ชั้นวาง: แต่ละแถวมีไม้กระดานรองอยู่ใต้ปก */
  .shelf {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(104px, 1fr));
    grid-auto-rows: var(--tile);
    padding: 0 10px;
    background-image: linear-gradient(to bottom,
      transparent 0, transparent var(--ch),
      #a67c4e var(--ch), #a67c4e calc(var(--ch) + 3px),
      #6e4a29 calc(var(--ch) + 3px), #54371c calc(var(--ch) + var(--plank)),
      rgba(0,0,0,.35) calc(var(--ch) + var(--plank)),
      transparent calc(var(--ch) + var(--plank) + 10px));
    background-size: 100% var(--tile);
    background-repeat: repeat-y;
  }

  .cell {
    background: none; border: 0; padding: 0 6px; margin: 0;
    color: inherit; font: inherit; cursor: pointer;
    display: flex; flex-direction: column; align-items: center;
  }
  .cell .cv { width: 100%; height: var(--ch); display: flex;
    align-items: flex-end; justify-content: center; }
  .cell img, .cell .ph {
    height: calc(var(--ch) - 6px); width: auto; max-width: 100%;
    object-fit: cover; border-radius: 2px 5px 5px 2px;
    box-shadow: 0 7px 10px rgba(0,0,0,.55), inset 3px 0 4px rgba(255,255,255,.12);
    transition: transform .15s;
  }
  .cell:hover img, .cell:active img { transform: translateY(-5px); }
  .cell:focus-visible { outline: 2px solid #e9c58f; outline-offset: -2px; }
  .cell .ph { width: 104px; background: #3b2c20; color: var(--dim);
    display: grid; place-items: center; font-size: 34px; }
  .cell .cap {
    margin-top: calc(var(--plank) + 4px); max-width: 100%;
    font-size: 13px; line-height: 1.3; text-align: center;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; overflow-wrap: anywhere;
  }

  #msg { padding: 40px 24px; text-align: center; color: var(--dim); }

  /* หน้าต่างเลือกเล่ม */
  #sheet { position: fixed; inset: 0; z-index: 10; background: rgba(8,5,3,.72);
    display: flex; align-items: flex-end; justify-content: center; }
  .panel { width: 100%; max-width: 640px; max-height: 82dvh; overflow: auto;
    background: linear-gradient(#2b1f15, #1c140e); border-top: 1px solid #5a3f27;
    border-radius: 16px 16px 0 0; padding: 14px 0 28px; }
  .head { display: flex; align-items: center; justify-content: space-between;
    padding: 0 8px 12px 20px; }
  .head h2 { margin: 0; font-size: 18px; font-weight: 600; }
  #sheetClose { background: none; border: 0; color: var(--ink); width: 40px; height: 40px;
    font-size: 20px; border-radius: 8px; cursor: pointer; }
  #sheetClose:active { background: #ffffff22; }
</style>
</head>
<body>

<header>
  <h1 id="siteTitle">ชั้นหนังสือ</h1>
  <div class="sub">แตะหนังสือเพื่อเลือกเล่ม</div>
</header>

<main>
  <div id="shelf" class="shelf"></div>
  <div id="msg" hidden>ไม่พบไฟล์ library.json หรือยังไม่มีรายการหนังสือ</div>
</main>

<div id="sheet" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="head">
      <h2 id="sheetTitle"></h2>
      <button id="sheetClose" aria-label="ปิด">✕</button>
    </div>
    <div id="vols" class="shelf"></div>
  </div>
</div>

<script>
  // repo เก็บรูป (เปิด GitHub Pages ไว้) และนามสกุลรูป
  const BASE = "https://doymili.github.io/doy-images/";
  const EXT = "jpg";
  // รายการเรื่อง/เล่มอยู่ในไฟล์ library.json (แก้ไฟล์นั้นเมื่อเพิ่มหนังสือ)

  const $ = id => document.getElementById(id);
  let LIB = null;

  function cover(src, label) {
    const wrap = document.createElement("div");
    wrap.className = "cv";
    const img = new Image();
    img.alt = label;
    img.loading = "lazy";
    img.decoding = "async";
    img.onerror = () => {                       // ไม่มีรูปปก: แสดงตัวอักษรแรกแทน
      const ph = document.createElement("div");
      ph.className = "ph";
      ph.textContent = label.slice(0, 1);
      img.replaceWith(ph);
    };
    if (src) img.src = src; else img.onerror();
    wrap.appendChild(img);
    return wrap;
  }

  function cell(label, src, onClick) {
    const b = document.createElement("button");
    b.className = "cell";
    b.type = "button";
    b.appendChild(cover(src, label));
    const cap = document.createElement("span");
    cap.className = "cap";
    cap.textContent = label;
    b.appendChild(cap);
    b.onclick = onClick;
    return b;
  }

  function renderShelf() {
    const shelf = $("shelf");
    shelf.textContent = "";
    LIB.series.forEach((s, i) => {
      const first = (s.volumes || [])[0];
      const src = s.cover ? BASE + s.cover
                : first ? `${BASE}${first.path}/page1.${EXT}` : "";
      shelf.appendChild(cell(s.title, src, () => openSeries(i)));
    });
  }

  function openSeries(i) {
    const s = LIB.series[i];
    $("sheetTitle").textContent = s.title;
    const box = $("vols");
    box.textContent = "";
    (s.volumes || []).forEach(v => {
      box.appendChild(cell(v.name, `${BASE}${v.path}/page1.${EXT}`, () => {
        location.href = "reader.html?book=" + encodeURI(v.path);
      }));
    });
    $("sheet").hidden = false;
    document.body.style.overflow = "hidden";
    history.pushState({ sheet: true }, "");      // ให้ปุ่มย้อนกลับของมือถือปิดหน้าต่างนี้
  }

  function closeSheet(fromPop) {
    if ($("sheet").hidden) return;
    $("sheet").hidden = true;
    document.body.style.overflow = "";
    if (!fromPop && history.state && history.state.sheet) history.back();
  }

  window.addEventListener("popstate", () => closeSheet(true));
  $("sheetClose").onclick = () => closeSheet(false);
  $("sheet").addEventListener("click", e => { if (e.target === $("sheet")) closeSheet(false); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(false); });

  fetch("library.json", { cache: "no-cache" })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(d => {
      LIB = d;
      if (d.title) { $("siteTitle").textContent = d.title; document.title = d.title; }
      if (!d.series || !d.series.length) { $("msg").hidden = false; return; }
      renderShelf();
    })
    .catch(() => { $("msg").hidden = false; });
</script>
</body>
</html>
